<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Archive Shelf</title>
  <meta name="description" content="An isometric shelf of frosted-glass folders drifting past. Hover to slow it, click to open a project.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://picsum.photos">
  <link rel="preconnect" href="https://fastly.picsum.photos">
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="carousel.css">
  <script type="importmap">
    {
      "imports": {
        "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/index.js"
      }
    }
  </script>
</head>
<body class="iso-page">
  <h1 class="sr-only">Archive shelf</h1>

  <!-- The shelf: an isometric row of frosted folders, drawn with plain 2D-transformed HTML -->
  <div class="iso" id="iso">
    <!-- term : definition (image 1's typography), flat -->
    <div class="def def--top" id="def-top" aria-hidden="true">
      <p class="def__term"></p>
      <p class="def__word"></p>
    </div>
    <div class="def def--bottom" id="def-bottom" aria-hidden="true">
      <p class="def__term"></p>
      <p class="def__word"></p>
      <p class="def__sub caps"></p>
    </div>

    <div class="iso__row" aria-hidden="true"></div>

    <!-- hover label: lies on the floor beside the hovered folder, reading along the card's width -->
    <div class="tag" aria-hidden="true">
      <span class="tag__dot"></span>
      <span class="tag__rule"></span>
      <div class="tag__text">
        <p class="tag__term"></p>
        <p class="tag__word"></p>
        <p class="tag__meta caps"></p>
      </div>
    </div>
  </div>

  <div class="iso__grain" aria-hidden="true"></div>

  <header class="iso__bar">
    <a class="iso__mark" href="index.html" aria-label="Archives — sphere view">
      <svg viewBox="0 0 28 28" aria-hidden="true">
        <path d="M5 9.5 11 13v9.5L5 19z" />
        <path d="M10 6.6 16 10.1v9.5l-6-3.5z" />
        <path d="M15 3.7 21 7.2v9.5l-6-3.5z" opacity=".55" />
      </svg>
    </a>
  </header>

  <!-- Keyboard / screen-reader access to every project (visually hidden) -->
  <nav class="sr-only" aria-label="Projects" id="a11y-index"></nav>

  <!-- Project page (shared with the sphere) -->
  <section class="pv" aria-hidden="true" aria-label="Project">
    <div class="pv__bg"></div>
    <div class="pv__bar">
      <button class="pv__close caps" type="button">&larr; Shelf</button>
      <span class="pv__count caps"></span>
    </div>
    <div class="pv__scroll">
      <article class="pv__inner">
        <div class="pv__head">
          <figure class="pv__hero"><img alt="" decoding="async"></figure>
          <div class="pv__info">
            <p class="pv__kicker caps reveal"></p>
            <h2 class="pv__title reveal"></h2>
            <p class="pv__text reveal"></p>
            <dl class="pv__meta reveal"></dl>
          </div>
        </div>
        <div class="pv__gallery"></div>
        <button class="pv__next reveal" type="button">
          <span class="caps">Next project</span>
          <strong class="pv__next-title"></strong>
        </button>
      </article>
    </div>
  </section>

  <!-- The photo that flies between the shelf and the project page -->
  <div class="flyer" aria-hidden="true"><img alt="" crossorigin="anonymous"></div>

  <noscript><p class="noscript caps">This archive needs JavaScript.</p></noscript>

  <script type="module" src="carousel.js?v=1"></script>
</body>
</html>
